name: Build Nintendo Switch NRO

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Switch dependencies
        run: |
          set -eux

          # Paquetes de devkitPro. Sin switch-pixman ni switch-libphysfs:
          # no existen en los repos y build_switch.sh compila Pixman desde fuente.
          dkp-pacman -S --noconfirm --needed \
            switch-sdl2 \
            switch-sdl2_image \
            switch-sdl2_ttf \
            switch-sdl2_mixer \
            switch-mesa \
            switch-libvorbis \
            switch-flac \
            switch-libtheora \
            switch-freetype \
            switch-mbedtls \
            switch-zlib \
            switch-bzip2 \
            switch-pkg-config \
            switch-tools \
            devkit-env

          # Herramientas del anfitrion. La imagen es Debian/Ubuntu: apt-get, no pacman.
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake \
            meson \
            ninja-build \
            python3-pip \
            imagemagick \
            ruby \
            git \
            ca-certificates \
            xxd

          # Falla aqui y no 30 segundos despues, en un sitio que no lo explica.
          cmake --version
          meson --version
          ninja --version
          xxd -v

      - name: Make build script executable and run
        run: |
          chmod +x build_switch.sh
          ./build_switch.sh

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokemonAnil-Switch-NRO
          path: port.nro
